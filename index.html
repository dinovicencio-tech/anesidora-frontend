<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anesidora Radio</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { color: #1DB954; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #aaaaaa; font-size: 14px; margin-bottom: 30px; }
        .layout { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto; gap: 20px; }
        
        .sidebar, .player-area, .queue-area { background-color: #1e1e1e; padding: 20px; border-radius: 10px; }
        .sidebar { width: 20%; }
        .queue-area { width: 30%; }
        .player-area { width: 40%; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 520px; }
        
        input { width: 80%; padding: 10px; border-radius: 5px; border: none; background: #333; color: white; outline: none; margin-bottom: 10px; }
        button.btn-ir { background: #1DB954; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        
        .estaciones-list { list-style: none; padding: 0; margin-top: 20px; }
        .estaciones-list li { padding: 12px 10px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .estaciones-list li.activa { color: #1DB954; border-left: 3px solid #1DB954; background: #252525; font-weight: bold; }
        
        #caratula-cancion { width: 100%; max-width: 280px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); background: #333; }
        .info-reproductor h2 { margin: 0; font-size: 20px; }
        .artista { color: #1DB954; font-weight: bold; margin-top: 5px; }
        .album { font-size: 13px; color: #777; margin-bottom: 15px; }

        .controles button { background: none; border: 1px solid #444; color: white; border-radius: 50%; width: 55px; height: 55px; cursor: pointer; margin: 0 8px; font-size: 20px; }
        .controles button:hover { background: #1DB954; border-color: #1DB954; }

        .queue-list { list-style: none; padding: 0; }
        .queue-list li { padding: 10px; border-bottom: 1px solid #2a2a2a; cursor: pointer; border-radius: 5px; margin-bottom: 4px; display: flex; flex-direction: column; }
        .queue-list li:hover { background: #2a2a2a; border-left: 3px solid #1DB954; }
        .queue-list li strong { font-size: 13px; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .queue-list li span { font-size: 11px; color: #1DB954; }
        .queue-list li em { font-size: 10px; color: #666; font-style: normal; }
        
        .msg-ia { text-align: center; font-size: 11px; color: #444; padding: 15px; font-style: italic; border-top: 1px solid #2a2a2a; margin-top: 10px; }
        #youtube-container { position: absolute; left: -9999px; }
    </style>
</head>
<body onload="inicializarApp()">

    <h1>Anesidora</h1>
    <p class="subtitle">Radio from the Smart Algorithm</p>

    <div class="layout">
        <div class="sidebar">
            <h3>Estaciones</h3>
            <input type="text" id="artista-input" placeholder="Ej: Radiohead">
            <button class="btn-ir" onclick="iniciarEstacionNueva()">IR</button>
            <ul class="estaciones-list" id="lista-estaciones"></ul>
        </div>

        <div class="player-area">
            <div id="estacion-label" style="color:#555; font-size:11px; font-weight:bold; margin-bottom:15px;">ESPERANDO</div>
            <img id="caratula-cancion" src="https://via.placeholder.com/300/1e1e1e/333?text=Anesidora" alt="">
            <div class="info-reproductor">
                <h2 id="titulo-cancion">Listo para sonar</h2>
                <div id="artista-cancion" class="artista"></div>
                <div id="album-cancion" class="album"></div>
            </div>
            <div class="controles">
                <button onclick="prevCancion()">⏮</button>
                <button onclick="togglePlayPause()" id="btn-play-pause">▶</button>
                <button onclick="nextCancion(true)">⏭</button>
            </div>
            <div id="status-api" style="font-size:10px; color:#333; margin-top:25px;">Cargando...</div>
        </div>

        <div class="queue-area">
            <h3>Próximas en sonar</h3>
            <ul class="queue-list" id="cola-lista"></ul>
            <div class="msg-ia" id="msg-ia"></div>
        </div>
    </div>

    <div id="youtube-container"><div id="player"></div></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, reproduciendo = false, colaCanciones = [], cancionActual = null, artistaActivo = "";
        const API_URL = "https://anesidora-api.onrender.com";

        async function inicializarApp() {
            fetch(API_URL).then(() => document.getElementById('status-api').innerText = "Cerebro Online ✅");
            cargarEstacionesGuardadas();
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', { height: '10', width: '10', videoId: '', playerVars: { 'autoplay': 1, 'controls': 0 },
                events: { 'onStateChange': e => {
                    if (e.data == YT.PlayerState.PLAYING) { document.getElementById('btn-play-pause').innerHTML = '⏸'; reproduciendo = true; }
                    else if (e.data == YT.PlayerState.PAUSED) { document.getElementById('btn-play-pause').innerHTML = '▶'; reproduciendo = false; }
                    else if (e.data == YT.PlayerState.ENDED) nextCancion(false);
                }}
            });
        }

        async function cargarEstacionesGuardadas() {
            try {
                const res = await fetch(`${API_URL}/listar-estaciones`);
                const datos = await res.json();
                const lista = document.getElementById('lista-estaciones');
                lista.innerHTML = "";
                if(datos.estaciones) datos.estaciones.forEach(art => agregarEstacionVisual(art));
            } catch (e) { console.error("Error DB"); }
        }

        function agregarEstacionVisual(artista, alInicio = false) {
            const lista = document.getElementById('lista-estaciones');
            const li = document.createElement('li');
            li.innerHTML = `<span>${artista}</span><button style="background:none; border:none; color:#555; cursor:pointer;" onclick="eliminarEstacion(event, '${artista}')">✖</button>`;
            li.onclick = () => reproducirEstacion(artista);
            li.dataset.artista = artista;
            alInicio ? lista.prepend(li) : lista.appendChild(li);
        }

        async function eliminarEstacion(e, artista) {
            e.stopPropagation();
            await fetch(`${API_URL}/borrar-estacion?artista=${encodeURIComponent(artista)}`);
            cargarEstacionesGuardadas();
        }

        async function iniciarEstacionNueva() {
            const art = document.getElementById('artista-input').value;
            if (!art) return;
            fetch(`${API_URL}/guardar-estacion?artista=${encodeURIComponent(art)}`);
            agregarEstacionVisual(art, true);
            reproducirEstacion(art);
            document.getElementById('artista-input').value = "";
        }

        async function reproducirEstacion(artista) {
            artistaActivo = artista;
            document.getElementById('estacion-label').innerText = "ESTACIÓN: " + artista.toUpperCase();
            document.getElementById('titulo-cancion').innerText = "Invocando... ☕";
            marcarActiva(artista);
            
            try {
                const resB = await fetch(`${API_URL}/buscar?artista=${encodeURIComponent(artista)}`);
                const datosB = await resB.json();
                if(!datosB.cancion_encontrada.length) throw "No hay resultados";
                
                const semilla = datosB.cancion_encontrada[0];
                cargarCancion(semilla);
                
                // Pedimos la radio
                const resR = await fetch(`${API_URL}/radio?video_id=${semilla.videoId}&artista=${encodeURIComponent(artista)}`);
                const datosR = await resR.json();
                colaCanciones = datosR.cola.slice(1);
                actualizarColaUI();
            } catch (e) { 
                console.log("Error de conexión:", e);
                document.getElementById('titulo-cancion').innerText = "Conexión lenta. Reintenta."; 
            }
        }

        function cargarCancion(c) {
            cancionActual = c;
            document.getElementById('titulo-cancion').innerText = c.title;
            
            let artNombre = c.artists ? (Array.isArray(c.artists) ? c.artists.map(a => a.name).join(", ") : (c.artists.name || c.artists)) : "Artista desconocido";
            document.getElementById('artista-cancion').innerText = artNombre;

            let albNombre = c.album ? (typeof c.album === 'object' ? c.album.name : c.album) : "";
            document.getElementById('album-cancion').innerText = albNombre;

            const thumb = (c.thumbnails && c.thumbnails.length) ? c.thumbnails[c.thumbnails.length-1].url : "";
            document.getElementById('caratula-cancion').src = thumb;
            player.loadVideoById(c.videoId);
        }

        function actualizarColaUI() {
            const ul = document.getElementById('cola-lista');
            ul.innerHTML = "";
            const proximas = colaCanciones.slice(0, 10);
            proximas.forEach((c, index) => {
                const li = document.createElement('li');
                let art = c.artists ? (Array.isArray(c.artists) ? c.artists.map(a => a.name).join(", ") : (c.artists.name || c.artists)) : "Varios";
                let alb = c.album ? (typeof c.album === 'object' ? c.album.name : c.album) : "";
                li.innerHTML = `<strong>${c.title}</strong><span>${art}</span><em>${alb}</em>`;
                li.onclick = () => saltarACancionDesdeCola(index);
                ul.appendChild(li);
            });
            document.getElementById('msg-ia').innerText = proximas.length > 0 ? "✨ Aprendiendo de tus gustos musicales..." : "";
        }

        function saltarACancionDesdeCola(index) {
            const elegida = colaCanciones[index];
            colaCanciones = colaCanciones.slice(index + 1);
            cargarCancion(elegida);
            actualizarColaUI();
        }

        function nextCancion(manual) {
            if (manual && cancionActual) {
                fetch(`${API_URL}/registrar-salto?video_id=${cancionActual.videoId}&titulo=${encodeURIComponent(cancionActual.title)}`);
            }
            if (colaCanciones.length > 0) { 
                const siguiente = colaCanciones.shift();
                cargarCancion(siguiente); 
                actualizarColaUI(); 
            } else if (cancionActual) {
                // Si la cola se vació (ej. por filtros), reintentamos generar radio
                reproducirEstacion(artistaActivo);
            }
        }

        function togglePlayPause() {
            const s = player.getPlayerState();
            s == 1 ? player.pauseVideo() : player.playVideo();
        }

        function marcarActiva(art) {
            document.querySelectorAll('.estaciones-list li').forEach(li => li.classList.remove('activa'));
            const el = Array.from(document.querySelectorAll('.estaciones-list li')).find(li => li.dataset.artista === art);
            if (el) el.classList.add('activa');
        }

        function prevCancion() { alert("Historial próximamente"); }
    </script>
</body>
</html>
