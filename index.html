<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anesidora Radio</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0b0b; color: #ffffff; margin: 0; padding: 20px; }
        h1 { color: #1DB954; text-align: center; margin-bottom: 5px; font-weight: 800; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 30px; }
        .layout { display: flex; justify-content: center; max-width: 1200px; margin: 0 auto; gap: 20px; }
        .sidebar, .player-area, .queue-area { background-color: #121212; padding: 20px; border-radius: 12px; border: 1px solid #222; }
        .sidebar { width: 20%; } .queue-area { width: 30%; } .player-area { width: 40%; text-align: center; }
        input { width: 85%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; margin-bottom: 10px; }
        button.btn-ir { background: #1DB954; color: black; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .estaciones-list { list-style: none; padding: 0; margin-top: 20px; }
        .estaciones-list li { padding: 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; background: #181818; }
        .estaciones-list li.activa { border: 1px solid #1DB954; color: #1DB954; }
        #caratula-cancion { width: 100%; max-width: 280px; border-radius: 10px; margin-bottom: 20px; background: #222; }
        .controles { margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .controles button { background: #fff; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; font-size: 18px; }
        .queue-list { list-style: none; padding: 0; }
        .queue-list li { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 6px; background: #181818; font-size: 13px; }
        #youtube-container { position: absolute; left: -9999px; }
    </style>
</head>
<body onload="inicializar()">

    <h1>Anesidora</h1>
    <p class="subtitle">Radio from the Smart Algorithm</p>

    <div class="layout">
        <div class="sidebar">
            <h3>Estaciones</h3>
            <input type="text" id="artista-input" placeholder="Artista...">
            <button class="btn-ir" onclick="nuevaEstacion()">CREAR</button>
            <ul id="lista-estaciones" class="estaciones-list"></ul>
        </div>

        <div class="player-area">
            <img id="caratula-cancion" src="https://via.placeholder.com/300/121212/222?text=..." alt="">
            <h2 id="titulo-cancion">Selecciona música</h2>
            <div id="artista-cancion" style="color:#1DB954; font-weight:bold;"></div>
            <div class="controles">
                <button onclick="prevCancion()">⏮</button>
                <button onclick="togglePlay()" id="btn-play">▶</button>
                <button onclick="nextCancion(true)">⏭</button>
            </div>
        </div>

        <div class="queue-area">
            <h3>Próximas</h3>
            <ul id="cola-lista" class="queue-list"></ul>
        </div>
    </div>

    <div id="youtube-container"><div id="player"></div></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, cola = [], actual = null, artistaActivo = "";
        const API = "https://anesidora-api.onrender.com";

        function inicializar() { cargarEstaciones(); }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', { height: '1', width: '1', videoId: '', 
                events: { 'onStateChange': e => { if(e.data == 0) nextCancion(false); } } 
            });
        }

        async function cargarEstaciones() {
            const res = await fetch(`${API}/listar-estaciones`);
            const data = await res.json();
            const ul = document.getElementById('lista-estaciones');
            ul.innerHTML = "";
            data.estaciones.forEach(art => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${art}</span><button onclick="borrarEstacion(event, '${art}')">✖</button>`;
                li.onclick = () => reproducir(art);
                ul.appendChild(li);
            });
        }

        async function nuevaEstacion() {
            const art = document.getElementById('artista-input').value;
            if(!art) return;
            await fetch(`${API}/guardar-estacion?artista=${encodeURIComponent(art)}`);
            reproducir(art);
            cargarEstaciones();
            document.getElementById('artista-input').value = "";
        }

        async function borrarEstacion(e, art) {
            e.stopPropagation();
            await fetch(`${API}/borrar-estacion?artista=${encodeURIComponent(art)}`);
            cargarEstaciones();
        }

        async function reproducir(artista) {
            artistaActivo = artista;
            document.getElementById('titulo-cancion').innerText = "Cargando...";
            try {
                const resB = await fetch(`${API}/buscar?artista=${encodeURIComponent(artista)}`);
                const dataB = await resB.json();
                const cancion = dataB.cancion_encontrada[0];
                if(!cancion) return;

                cargarInfo(cancion);
                player.loadVideoById(cancion.videoId);

                const resR = await fetch(`${API}/radio?video_id=${cancion.videoId}&artista=${encodeURIComponent(artista)}`);
                const dataR = await resR.json();
                cola = dataR.cola || [];
                actualizarCola();
            } catch (e) {
                document.getElementById('titulo-cancion').innerText = "Error de conexión";
            }
        }

        function cargarInfo(c) {
            actual = c;
            document.getElementById('titulo-cancion').innerText = c.title;
            document.getElementById('artista-cancion').innerText = artistaActivo;
            document.getElementById('caratula-cancion').src = c.thumbnails[c.thumbnails.length-1].url;
        }

        function actualizarCola() {
            const ul = document.getElementById('cola-lista');
            ul.innerHTML = cola.slice(0, 10).map((c, i) => `<li onclick="saltarA(${i})">${c.title}</li>`).join("");
        }

        function saltarA(i) {
            const c = cola[i];
            cola = cola.slice(i + 1);
            cargarInfo(c);
            player.loadVideoById(c.videoId);
            actualizarCola();
        }

        function nextCancion(manual) {
            if(manual && actual) fetch(`${API}/registrar-salto?video_id=${actual.videoId}&titulo=${encodeURIComponent(actual.title)}`);
            if(cola.length > 0) {
                const c = cola.shift();
                cargarInfo(c);
                player.loadVideoById(c.videoId);
                actualizarCola();
            } else {
                reproducir(artistaActivo);
            }
        }

        function togglePlay() {
            const s = player.getPlayerState();
            s == 1 ? player.pauseVideo() : player.playVideo();
        }

        function prevCancion() { alert("Historial no disponible"); }
    </script>
</body>
</html>
