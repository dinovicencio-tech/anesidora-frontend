<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anesidora Radio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { color: #1DB954; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #aaaaaa; margin-top: 0; margin-bottom: 30px; font-size: 14px; }
        .layout { display: flex; justify-content: space-between; max-width: 1200px; margin: 0 auto; gap: 20px; }
        .sidebar { width: 25%; background-color: #1e1e1e; padding: 20px; border-radius: 10px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-group input { flex: 1; padding: 10px; border-radius: 5px; border: none; outline: none; background-color: #333; color: white;}
        .input-group button { padding: 10px; background-color: #1DB954; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
        .estaciones-list { list-style: none; padding: 0; margin: 0; }
        .estaciones-list li { padding: 12px 10px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; transition: all 0.2s; }
        .estaciones-list li:hover { background-color: #2a2a2a; }
        .estaciones-list li.activa { color: #1DB954; font-weight: bold; border-left: 3px solid #1DB954; background-color: #252525; }
        .btn-eliminar { background: none; border: none; color: #888; cursor: pointer; font-size: 16px; }
        .btn-eliminar:hover { color: #ff4444; }
        .player-area { width: 45%; background-color: #1e1e1e; padding: 30px; border-radius: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        #estacion-actual-label { color: #1DB954; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; font-weight: bold; }
        #caratula-cancion { width: 100%; max-width: 300px; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 5px; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); background-color: #333; margin-bottom: 20px; }
        .controles { display: flex; gap: 20px; margin-top: 20px; align-items: center; }
        .controles button { background-color: transparent; color: white; border: 1px solid #555; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; }
        .controles button:hover { background-color: #1DB954; border-color: #1DB954; }
        .queue-area { width: 25%; background-color: #1e1e1e; padding: 20px; border-radius: 10px; }
        .queue-list { list-style: none; padding: 0; font-size: 14px;}
        .queue-list li { padding: 8px 0; border-bottom: 1px dashed #333; color: #ccc;}
        .queue-list li span { color: #888; font-size: 12px; display: block;}
        #youtube-container { position: absolute; left: -9999px; }
    </style>
</head>
<body>

    <h1>Anesidora</h1>
    <p class="subtitle">Radio from the Smart Algorithm</p>

    <div class="layout">
        <div class="sidebar">
            <h3>Crear Estación</h3>
            <div class="input-group">
                <input type="text" id="artista-input" placeholder="Ej: Mute Math">
                <button onclick="iniciarEstacionNueva()">IR</button>
            </div>
            <h3>Tus Estaciones</h3>
            <ul class="estaciones-list" id="lista-estaciones"></ul>
        </div>

        <div class="player-area">
            <div id="estacion-actual-label">NINGUNA ESTACIÓN ACTIVA</div>
            <img id="caratula-cancion" src="" alt="">
            <h2 id="titulo-cancion" style="margin: 0; font-size: 22px;">Esperando música...</h2>
            
            <div class="controles">
                <button onclick="prevCancion()" title="Atrás">⏮</button>
                <button onclick="togglePlayPause()" id="btn-play-pause" title="Play/Pausa">▶</button>
                <button onclick="nextCancion(true)" title="Siguiente">⏭</button>
            </div>
        </div>

        <div class="queue-area">
            <h3>Próximas en sonar</h3>
            <ul class="queue-list" id="cola-lista">
                <li>El algoritmo está descansando...</li>
            </ul>
        </div>
    </div>

    <div id="youtube-container"><div id="player"></div></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let reproduciendo = false;
        let colaCanciones = []; 
        let cancionActual = null; // NUEVO: Memoria de lo que está sonando

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '10', width: '10', videoId: '',
                playerVars: { 'autoplay': 1, 'controls': 0 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            const btn = document.getElementById('btn-play-pause');
            if (event.data == YT.PlayerState.PLAYING) {
                btn.innerHTML = '⏸';
                reproduciendo = true;
            } else if (event.data == YT.PlayerState.PAUSED) {
                btn.innerHTML = '▶';
                reproduciendo = false;
            } else if (event.data == YT.PlayerState.BUFFERING) {
                btn.innerHTML = '⏳';
            } else if (event.data == YT.PlayerState.ENDED) {
                // Si termina sola, es un paso natural (false)
                nextCancion(false);
            }
        }

        function iniciarEstacionNueva() {
            const artista = document.getElementById('artista-input').value;
            if (!artista) return;
            agregarEstacionALista(artista);
            reproducirEstacion(artista);
            document.getElementById('artista-input').value = ""; 
        }

        function agregarEstacionALista(artista) {
            const lista = document.getElementById('lista-estaciones');
            const li = document.createElement('li');
            const spanTexto = document.createElement('span');
            spanTexto.innerText = artista + " Radio";
            spanTexto.onclick = () => reproducirEstacion(artista);
            
            const btnEliminar = document.createElement('button');
            btnEliminar.innerText = "✖";
            btnEliminar.className = "btn-eliminar";
            btnEliminar.onclick = (e) => { e.stopPropagation(); lista.removeChild(li); };

            li.appendChild(spanTexto);
            li.appendChild(btnEliminar);
            li.dataset.artista = artista;
            lista.prepend(li);
        }

        async function reproducirEstacion(artista) {
            document.getElementById('estacion-actual-label').innerText = "ESTACIÓN: " + artista;
            document.getElementById('titulo-cancion').innerText = "Cargando...";
            document.getElementById('btn-play-pause').innerHTML = '⏳';
            marcarEstacionActivaEnLista(artista);
            
            try {
                const urlBuscar = `https://anesidora-api.onrender.com/buscar?artista=${artista}`;
                const resBuscar = await fetch(urlBuscar);
                const datosBuscar = await resBuscar.json();
                const cancionSemilla = datosBuscar.cancion_encontrada[0];
                
                cargarInfoEnPantalla(cancionSemilla);
                player.loadVideoById(cancionSemilla.videoId);

                document.getElementById('cola-lista').innerHTML = "<li>Analizando el genoma musical... ⏳</li>";
                const urlRadio = `https://anesidora-api.onrender.com/radio?video_id=${cancionSemilla.videoId}`;
                const resRadio = await fetch(urlRadio);
                const datosRadio = await resRadio.json();
                
                colaCanciones = datosRadio.cola.slice(1);
                actualizarUICola();

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('titulo-cancion').innerText = "Error al conectar.";
                document.getElementById('btn-play-pause').innerHTML = '▶';
            }
        }

        function cargarInfoEnPantalla(cancion) {
            cancionActual = cancion; // Guardamos la canción activa
            document.getElementById('titulo-cancion').innerText = cancion.title;
            if (cancion.thumbnails && cancion.thumbnails.length > 0) {
                document.getElementById('caratula-cancion').src = cancion.thumbnails[cancion.thumbnails.length - 1].url;
            }
        }

        function actualizarUICola() {
            const ul = document.getElementById('cola-lista');
            ul.innerHTML = "";
            const aMostrar = colaCanciones.slice(0, 5);
            aMostrar.forEach(c => {
                const li = document.createElement('li');
                const nombreArtista = (c.artists && c.artists.length > 0) ? c.artists[0].name : "Artista Desconocido";
                li.innerHTML = `${c.title} <span>${nombreArtista}</span>`;
                ul.appendChild(li);
            });
        }

        // NUEVO: La función ahora recibe si el salto fue manual
        function nextCancion(esSaltoManual = false) { 
            if (colaCanciones.length > 0) {
                
                // Si el usuario apretó el botón, le avisamos a la base de datos
                if (esSaltoManual && cancionActual) {
                    const urlSalto = `https://anesidora-api.onrender.com/registrar-salto?video_id=${cancionActual.videoId}&titulo=${encodeURIComponent(cancionActual.title)}`;
                    fetch(urlSalto).catch(err => console.error("Error al registrar salto:", err));
                }

                const siguiente = colaCanciones.shift();
                cargarInfoEnPantalla(siguiente);
                player.loadVideoById(siguiente.videoId);
                actualizarUICola();
            } else {
                document.getElementById('titulo-cancion').innerText = "Fin de la radio.";
                player.stopVideo();
            }
        }

        function prevCancion() { 
            alert("Próximamente: Historial hacia atrás."); 
        }

        function togglePlayPause() {
            if (!player || !player.getPlayerState) return;
            const estado = player.getPlayerState();
            if (estado == YT.PlayerState.PLAYING) player.pauseVideo();
            else if (estado == YT.PlayerState.PAUSED || estado == YT.PlayerState.CUED) player.playVideo();
        }

        function marcarEstacionActivaEnLista(artista) {
            const elementos = document.querySelectorAll('.estaciones-list li');
            elementos.forEach(el => el.classList.remove('activa'));
            elementos.forEach(el => { if(el.dataset.artista === artista) el.classList.add('activa'); });
        }
    </script>
</body>
</html>
